<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手寫字體．古詩展示</title>
    <style>
        :root {
            --ink: #2d2926;
            --paper: #f7f1e5;
            --paper2: #eee4d2;
            --hand: #a84d3d;
            --machine: #315b78;
            --gold: #b18a45;
            --card: rgba(255, 255, 255, .68);
            --shadow: 0 18px 50px rgba(49, 37, 24, .13);
            /* 新增：字體縮放倍率預設為 1 */
            --font-scale: 1; 
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: radial-gradient(circle at 20% 15%, rgba(177, 138, 69, .12), transparent 28%),
                        radial-gradient(circle at 85% 80%, rgba(49, 91, 120, .10), transparent 30%),
                        linear-gradient(135deg, var(--paper), var(--paper2));
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
            transition: .35s;
        }

        body.bg-night {
            --ink: #eee7da;
            --paper: #17191c;
            --paper2: #25262a;
            --hand: #e78f7f;
            --machine: #6ca2c9;
            --card: rgba(36, 38, 42, .82);
            background: radial-gradient(circle at 70% 15%, rgba(177, 138, 69, .16), transparent 28%),
                        linear-gradient(135deg, #141518, #292a2e);
        }

        header {
            padding: 30px 7vw 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand small {
            display: block;
            font-size: 12px;
            opacity: .6;
            letter-spacing: .22em;
            margin-bottom: 7px;
        }

        .brand h1 {
            margin: 0;
            font-family: "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: .12em;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid rgba(80, 65, 50, .2);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.active {
            background: var(--ink);
            color: var(--paper);
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        main {
            width: min(1120px, 92vw);
            margin: 20px auto 60px;
        }

        .control-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 24px;
            flex-wrap: wrap;
            background: var(--card);
            border: 1px solid rgba(100, 80, 55, .13);
            border-radius: 22px;
            padding: 15px 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .student-input-wrap,
        .font-input-wrap,
        .font-size-wrap {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .student-input-wrap label,
        .font-input-wrap label,
        .font-size-wrap label {
            font-size: 12px;
            opacity: .65;
        }

        .student-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            border: 1px solid rgba(80, 65, 50, .2);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 14px;
            outline: none;
            min-width: 190px;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(177, 138, 69, .12);
        }

        input[type="file"] {
            max-width: 245px;
            font-size: 12px;
        }
        
        /* 新增：控制拉桿的樣式 */
        input[type="range"] {
            accent-color: var(--gold);
            cursor: pointer;
            width: 130px;
        }
        
        .file-name {
            display: none;
            font-size: 12px;
            opacity: .65;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-status {
            font-size: 12px;
            opacity: .72;
            margin-left: auto; /* 讓狀態文字靠右對齊 */
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 22px 0 15px;
        }

        .tab.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .book {
            background: var(--card);
            border-radius: 30px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(100, 80, 55, .12);
        }

        .book::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('PGE.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.12; 
            z-index: 0;
            pointer-events: none; 
        }
        
        .book > * {
            position: relative;
            z-index: 1;
        }

        .book-top {
            padding: 25px 7% 5px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        .student-display {
            text-align: center;
            padding: 28px 20px 4px;
        }

        .student-display-label {
            font-size: 12px;
            letter-spacing: .22em;
            opacity: .5;
            margin-bottom: 8px;
        }

        .student-display-name {
            font-family: "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.25;
            letter-spacing: .12em;
            min-height: 1.4em;
            color: var(--ink);
        }

        .poem-title {
            font-family: "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: 34px;
        }
        
        .poem-author, .page-number {
            opacity: .58;
            margin-top: 8px;
        }

        .page {
            min-height: 540px;
            padding: 42px 8% 50px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page:before {
            content: "";
            position: absolute;
            inset: 20px 5%;
            border: 1px solid rgba(120, 95, 60, .12);
            border-radius: 20px;
            pointer-events: none;
        }

        .line {
            position: relative;
            z-index: 1;
            /* 新增：利用 calc() 乘上 --font-scale 倍率來達成動態縮放 */
            font-size: calc(clamp(25px, 3.4vw, 42px) * var(--font-scale));
            line-height: 1.9;
            text-align: center;
            letter-spacing: .13em;
            /* 讓放大縮小過程有一點平滑動畫效果 */
            transition: font-size 0.15s ease-out; 
        }

        .hand {
            color: var(--hand);
            font-weight: 500;
        }

        .machine {
            color: var(--machine);
            font-weight: 500;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            opacity: .8;
            padding-bottom: 24px;
        }

        .legend .item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.hand {
            background: var(--hand);
        }

        .dot.machine {
            background: var(--machine);
        }

        .page-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 0 0 28px;
        }

        .info {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-card {
            background: var(--card);
            padding: 18px 20px;
            border-radius: 18px;
            border: 1px solid rgba(100, 80, 55, .12);
        }

        .info-card b {
            display: block;
            margin-bottom: 7px;
        }

        .hint {
            font-size: 13px;
            line-height: 1.75;
            opacity: .72;
        }

        code {
            font-family: ui-monospace, monospace;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
            .info {
                grid-template-columns: 1fr;
            }
            .page {
                min-height: 460px;
                padding: 30px 5%;
            }
            .line {
                letter-spacing: .05em;
            }
            .file-status {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <small>FONT GENERATION · POETRY DEMO</small>
            <h1>手寫字體．古詩展示</h1>
        </div>
        <div class="toolbar">
            <button id="musicBtn">♫ 播放音樂</button>
            <button id="paperBtn" class="active">紙本</button>
            <button id="nightBtn">夜色</button>
        </div>
    </header>

    <main>
        <section class="control-bar">
            <div class="student-input-wrap">
                <label for="studentNameInput">目前學生姓名</label>
                <div class="student-input-row">
                    <input id="studentNameInput" type="text" placeholder="請輸入學生姓名">
                    <button id="applyStudentNameBtn" type="button">套用</button>
                </div>
            </div>
            <div class="font-input-wrap">
                <label for="fontFileInput">學生字體</label>
                <div class="student-input-row">
                    <input id="fontFileInput" type="file" accept=".ttf,.otf,.woff,.woff2">
                    <span class="file-name" id="fontFileName">尚未選擇字體</span>
                </div>
            </div>
            <!-- 新增的文字大小拉桿 -->
            <div class="font-size-wrap">
                <label for="fontSizeSlider">詩詞大小</label>
                <div class="student-input-row">
                    <input type="range" id="fontSizeSlider" min="0.8" max="1.8" step="0.05" value="1">
                </div>
            </div>
            <div class="file-status" id="fileStatus">等待學生姓名與字體</div>
        </section>

        <div class="tabs">
            <button class="tab active" data-poem="changhenge">長恨歌</button>
            <button class="tab" data-poem="pipa">琵琶行</button>
        </div>

        <section class="book">
            <div class="student-display">
                <div class="student-display-label">本次展示學生</div>
                <div class="student-display-name" id="studentDisplayName">請輸入學生姓名</div>
            </div>

            <div class="book-top">
                <div>
                    <div class="poem-title" id="poemTitle">長恨歌</div>
                    <div class="poem-author" id="poemAuthor">白居易</div>
                </div>
                <div class="page-number" id="pageTotal"></div>
            </div>
            <div class="page" id="page"></div>
            <div class="legend">
                <span class="item"><i class="dot hand"></i>手寫內容</span>
                <span class="item"><i class="dot machine"></i>機器生成</span>
            </div>
            <div class="page-control">
                <button id="prevBtn">← 上一頁</button>
                <span class="page-number" id="pageNumber">1 / 1</span>
                <button id="nextBtn">下一頁 →</button>
            </div>
        </section>
    </main>

    <script>
        const poems = {
            changhenge: {
                title: "長恨歌",
                author: "白居易",
                pages: [
                    [["漢皇重色思傾國", "後宮佳麗三千人"], ["三千寵愛在一身", "金屋妝成嬌侍夜"], ["春宵苦短日高起", "從此君王不早朝"], ["春寒賜浴華清池", "溫泉水滑洗凝脂"]],
                    [["春寒賜浴華清池", "溫泉水滑洗凝脂"], ["侍兒扶起嬌無力", "始是新承恩澤時"], ["雲鬢花顏金步搖", "芙蓉帳暖度春宵"], ["春宵苦短日高起", "從此君王不早朝"]]
                ]
            },
            pipa: {
                title: "琵琶行",
                author: "白居易",
                pages: [
                    [["潯陽江頭夜送客", "楓葉荻花秋瑟瑟"], ["主人下馬客在船", "舉酒欲飲無管弦"], ["醉不成歡慘將別", "別時茫茫江浸月"], ["忽聞水上琵琶聲", "主人忘歸客不發"]],
                    [["尋聲暗問彈者誰", "琵琶聲停欲語遲"], ["移船相近邀相見", "添酒回燈重開宴"], ["千呼萬喚始出來", "猶抱琵琶半遮面"], ["轉軸撥弦三兩聲", "未成曲調先有情"]]
                ]
            }
        };

        const demoConfig = { 
            handwritingFile: "handwriting.txt", 
            musicFile: "background.mp3" 
        };
        
        let currentPoem = "changhenge", 
            currentPage = 0, 
            handwritingText = "", 
            fontLoaded = false, 
            audio = null, 
            currentStudentName = "", 
            currentFontName = "DemoStudentFont";
            
        const $ = id => document.getElementById(id);
        const normalize = s => (s || "").replace(/\s+/g, "");

        async function loadHandwritingAndMusic() {
            const status = [];
            try {
                const r = await fetch(demoConfig.handwritingFile, { cache: "no-store" });
                if (!r.ok) throw new Error("Fetch failed");
                handwritingText = normalize(await r.text());
                status.push(`TXT ✓（${[...handwritingText].length} 字）`);
            } catch (error) {
                handwritingText = "";
                status.push("handwriting.txt 未找到");
            }
            
            audio = new Audio(demoConfig.musicFile);
            audio.loop = true;
            audio.volume = .3;
            status.push("MP3 已設定");
            
            $("fileStatus").textContent = status.join(" ｜ ");
            render();
        }

        async function loadStudentFont(file) {
            if (!file) {
                $("fileStatus").textContent = "請選擇學生字體檔";
                return;
            }
            try {
                const buffer = await file.arrayBuffer();
                currentFontName = "DemoStudentFont_" + Date.now();
                const face = new FontFace(currentFontName, buffer);
                await face.load();
                document.fonts.add(face);
                fontLoaded = true;
                $("fontFileName").textContent = file.name;
                $("fileStatus").textContent = `${currentStudentName || "目前學生"} ｜ 字體 ✓ ${file.name}`;
                render();
            } catch (e) {
                fontLoaded = false;
                $("fontFileName").textContent = "字體載入失敗";
                $("fileStatus").textContent = "無法載入字體，請確認檔案格式";
            }
        }

        function classify(text) {
            const out = [];
            for (const c of [...normalize(text)]) {
                if (handwritingText.includes(c)) {
                    out.push("hand");
                } else {
                    out.push("machine");
                }
            }
            return out;
        }

        function segmented(text) {
            const t = normalize(text), c = classify(t);
            return [...t].map((x, i) => `<span class="${c[i]}">${x}</span>`).join("");
        }

        function render() {
            const poem = poems[currentPoem];
            $("poemTitle").textContent = poem.title;
            $("poemAuthor").textContent = poem.author;
            $("pageTotal").textContent = `共 ${poem.pages.length} 頁`;
            $("pageNumber").textContent = `${currentPage + 1} / ${poem.pages.length}`;
            $("prevBtn").disabled = currentPage === 0;
            $("nextBtn").disabled = currentPage === poem.pages.length - 1;
            
            const page = $("page");
            page.innerHTML = "";
            
            for (const [a, b] of poem.pages[currentPage]) {
                const d = document.createElement("div");
                d.className = "line";
                d.innerHTML = segmented(a) + " " + segmented(b);
                page.appendChild(d);
            }
            
            const demoFont = fontLoaded
                ? `"${currentFontName}", serif`
                : '"STKaiti", "KaiTi", "DFKai-SB", serif';

            page.style.fontFamily = demoFont;
            $("studentDisplayName").style.fontFamily = demoFont;
        }

        function applyStudentName() {
            currentStudentName = $("studentNameInput").value.trim() || "展示者姓名";
            $("studentDisplayName").textContent = currentStudentName;
            $("fileStatus").textContent = `${currentStudentName} ｜ ${fontLoaded ? "字體已載入" : "尚未載入字體"}`;
            render();
        }

        $("applyStudentNameBtn").onclick = applyStudentName;
        
        $("studentNameInput").addEventListener("input", e => {
            $("studentDisplayName").textContent = e.target.value.trim() || "請輸入學生姓名";
        });
        
        $("studentNameInput").addEventListener("keydown", e => {
            if (e.key === "Enter") applyStudentName();
        });
        
        $("fontFileInput").addEventListener("change", e => loadStudentFont(e.target.files[0]));

        // 新增：監聽拉桿事件，即時改變 CSS 變數中的縮放倍率
        $("fontSizeSlider").addEventListener("input", e => {
            document.documentElement.style.setProperty('--font-scale', e.target.value);
        });

        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                currentPoem = t.dataset.poem;
                currentPage = 0;
                render();
            }
        });

        $("prevBtn").onclick = () => {
            if (currentPage > 0) {
                currentPage--;
                render();
            }
        };

        $("nextBtn").onclick = () => {
            if (currentPage < poems[currentPoem].pages.length - 1) {
                currentPage++;
                render();
            }
        };

        $("paperBtn").onclick = () => {
            document.body.classList.remove("bg-night");
            $("paperBtn").classList.add("active");
            $("nightBtn").classList.remove("active");
        };

        $("nightBtn").onclick = () => {
            document.body.classList.add("bg-night");
            $("nightBtn").classList.add("active");
            $("paperBtn").classList.remove("active");
        };

        $("musicBtn").onclick = async () => {
            if (!audio) {
                $("fileStatus").textContent = "找不到 background.mp3";
                return;
            }
            if (audio.paused) {
                try {
                    await audio.play();
                    $("musicBtn").textContent = "♫ 關閉音樂";
                } catch {
                    $("fileStatus").textContent = "MP3 無法播放，請確認檔案位於專案資料夾";
                }
            } else {
                audio.pause();
                $("musicBtn").textContent = "♫ 播放音樂";
            }
        };

        loadHandwritingAndMusic();
    </script>
</body>
</html>
