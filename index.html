<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手寫字體．古詩展示</title>
    <style>
        :root {
            --ink: #2d2926;
            --paper: #f7f1e5;
            --paper2: #eee4d2;
            --hand: #a84d3d;
            --machine: #315b78;
            --gold: #b18a45;
            --card: rgba(255, 255, 255, .68);
            --shadow: 0 18px 50px rgba(49, 37, 24, .13);
            /* 新增：字體縮放倍率預設為 1 */
            --font-scale: 1; 
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: radial-gradient(circle at 20% 15%, rgba(177, 138, 69, .12), transparent 28%),
                        radial-gradient(circle at 85% 80%, rgba(49, 91, 120, .10), transparent 30%),
                        linear-gradient(135deg, var(--paper), var(--paper2));
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
            transition: .35s;
        }

        body.bg-night {
            --ink: #eee7da;
            --paper: #17191c;
            --paper2: #25262a;
            --hand: #e78f7f;
            --machine: #6ca2c9;
            --card: rgba(36, 38, 42, .82);
            background: radial-gradient(circle at 70% 15%, rgba(177, 138, 69, .16), transparent 28%),
                        linear-gradient(135deg, #141518, #292a2e);
        }

        header {
            padding: 30px 7vw 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand small {
            display: block;
            font-size: 12px;
            opacity: .6;
            letter-spacing: .22em;
            margin-bottom: 7px;
        }

        .brand h1 {
            margin: 0;
            font-family: "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: .12em;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid rgba(80, 65, 50, .2);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.active {
            background: var(--ink);
            color: var(--paper);
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        main {
            width: min(1120px, 92vw);
            margin: 20px auto 60px;
        }

        .control-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 24px;
            flex-wrap: wrap;
            background: var(--card);
            border: 1px solid rgba(100, 80, 55, .13);
            border-radius: 22px;
            padding: 15px 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .live-display-wrap,
        .font-input-wrap,
        .font-size-wrap {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .live-display-wrap label,
        .font-input-wrap label,
        .font-size-wrap label {
            font-size: 12px;
            opacity: .65;
        }

        .live-display-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            border: 1px solid rgba(80, 65, 50, .2);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 14px;
            outline: none;
            min-width: 190px;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(177, 138, 69, .12);
        }

        select {
            border: 1px solid rgba(80, 65, 50, .2);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 36px 9px 14px;
            outline: none;
            min-width: 190px;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(177, 138, 69, .12);
        }

        .student-select-wrap {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .student-select-wrap label {
            font-size: 12px;
            opacity: .65;
        }

        input[type="file"] {
            max-width: 245px;
            font-size: 12px;
        }
        
        /* 新增：控制拉桿的樣式 */
        input[type="range"] {
            accent-color: var(--gold);
            cursor: pointer;
            width: 130px;
        }
        
        .file-name {
            display: none;
            font-size: 12px;
            opacity: .65;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-status {
            font-size: 12px;
            opacity: .72;
            margin-left: auto; /* 讓狀態文字靠右對齊 */
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 22px 0 15px;
        }

        .tab.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .book {
            background: var(--card);
            border-radius: 30px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(100, 80, 55, .12);
        }

        .book::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--poem-bg, url('img/PGE_chg'));
            background-size: cover;
            background-position: center;
            opacity: 0.12; 
            z-index: 0;
            pointer-events: none; 
        }
        
        .book > * {
            position: relative;
            z-index: 1;
        }

        .book-top {
            padding: 25px 7% 5px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        .live-display {
            text-align: center;
            padding: 28px 20px 4px;
        }

        .live-display-label {
            font-size: 12px;
            letter-spacing: .22em;
            opacity: .5;
            margin-bottom: 8px;
        }

        .live-display-name {
            font-family: "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.25;
            letter-spacing: .12em;
            min-height: 1.4em;
            color: var(--ink);
        }

        .poem-title {
            font-family: "NotoSans", "STKaiti", "KaiTi", "DFKai-SB", serif;
            font-size: 34px;
        }
        
        .poem-author, .page-number {
            opacity: .58;
            margin-top: 8px;
        }

        .page {
            min-height: 540px;
            padding: 42px 8% 50px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page:before {
            content: "";
            position: absolute;
            inset: 20px 5%;
            border: 1px solid rgba(120, 95, 60, .12);
            border-radius: 20px;
            pointer-events: none;
        }

        .line {
            position: relative;
            z-index: 1;
            /* 新增：利用 calc() 乘上 --font-scale 倍率來達成動態縮放 */
            font-size: calc(clamp(25px, 3.4vw, 42px) * var(--font-scale));
            line-height: 1.9;
            text-align: center;
            letter-spacing: .13em;
            /* 讓放大縮小過程有一點平滑動畫效果 */
            transition: font-size 0.15s ease-out; 
        }

        .hand {
            color: var(--hand);
            font-weight: 500;
        }

        .machine {
            color: var(--machine);
            font-weight: 500;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            opacity: .8;
            padding-bottom: 24px;
        }

        .legend .item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.hand {
            background: var(--hand);
        }

        .dot.machine {
            background: var(--machine);
        }

        .page-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 0 0 28px;
        }

        .info {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-card {
            background: var(--card);
            padding: 18px 20px;
            border-radius: 18px;
            border: 1px solid rgba(100, 80, 55, .12);
        }

        .info-card b {
            display: block;
            margin-bottom: 7px;
        }

        .hint {
            font-size: 13px;
            line-height: 1.75;
            opacity: .72;
        }

        code {
            font-family: ui-monospace, monospace;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
            .info {
                grid-template-columns: 1fr;
            }
            .page {
                min-height: 460px;
                padding: 30px 5%;
            }
            .line {
                letter-spacing: .05em;
            }
            .file-status {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <small>FONT GENERATION · POETRY DEMO</small>
            <h1>手寫字體．古詩展示</h1>
        </div>
        <div class="toolbar">
            <button id="musicBtn">♫ 播放音樂</button>
            <button id="paperBtn" class="active">紙本</button>
            <button id="nightBtn">夜色</button>
        </div>
    </header>

    <main>
        <section class="control-bar">
            <div class="live-display-wrap">
                <label for="liveDisplayInput">即時展示</label>
                <div class="live-display-row">
                    <input id="liveDisplayInput" type="text" placeholder="請輸入展示名稱">
                </div>
            </div>
            <div class="student-select-wrap">
                <label for="studentSelect">學生字體</label>
                <div class="live-display-row">
                    <select id="studentSelect">
                        <option value="">讀取學生名單中...</option>
                    </select>
                </div>
            </div>
            <div class="font-input-wrap">
                <label for="fontFileInput">展示字體</label>
                <div class="live-display-row">
                    <input id="fontFileInput" type="file" accept=".ttf,.otf,.woff,.woff2">
                    <span class="file-name" id="fontFileName">尚未選擇字體</span>
                </div>
            </div>
            <!-- 新增的文字大小拉桿 -->
            <div class="font-size-wrap">
                <label for="fontSizeSlider">詩詞大小</label>
                <div class="live-display-row">
                    <input type="range" id="fontSizeSlider" min="0.8" max="1.8" step="0.05" value="1">
                </div>
            </div>
            <div class="file-status" id="fileStatus">等待即時展示與字體</div>
        </section>

        <div class="tabs">
            <button class="tab active" data-poem="changhenge">長恨歌</button>
            <button class="tab" data-poem="pipa">琵琶行</button>
        </div>

        <section class="book">
            <div class="live-display">
                <div class="live-display-label">即時展示</div>
                <div class="live-display-name" id="liveDisplayName">請輸入展示名稱</div>
            </div>

            <div class="book-top">
                <div>
                    <div class="poem-title" id="poemTitle">長恨歌</div>
                    <div class="poem-author" id="poemAuthor">白居易</div>
                </div>
                <div class="page-number" id="pageTotal"></div>
            </div>
            <div class="page" id="page"></div>
            <div class="legend">
                <span class="item"><i class="dot hand"></i>手寫內容</span>
                <span class="item"><i class="dot machine"></i>機器生成</span>
            </div>
            <div class="page-control">
                <button id="prevBtn">← 上一頁</button>
                <span class="page-number" id="pageNumber">1 / 1</span>
                <button id="nextBtn">下一頁 →</button>
            </div>
        </section>
    </main>

    <script>
        const poems = {
            changhenge: {
                title: "長恨歌",
                author: "白居易",
                background: "./img/PGE_chg.jpg",
                pages: [
                    [["漢皇重色思傾國", "後宮佳麗三千人"], ["三千寵愛在一身", "金屋妝成嬌侍夜"], ["春宵苦短日高起", "從此君王不早朝"], ["春寒賜浴華清池", "溫泉水滑洗凝脂"]],
                    [["春寒賜浴華清池", "溫泉水滑洗凝脂"], ["侍兒扶起嬌無力", "始是新承恩澤時"], ["雲鬢花顏金步搖", "芙蓉帳暖度春宵"], ["春宵苦短日高起", "從此君王不早朝"]],
                    [["承歡侍宴無閑暇", "春從春遊夜專夜"], ["後宮佳麗三千人", "三千寵愛在一身"], ["金屋粧成嬌侍夜", "玉樓宴罷醉和春"], ["姊妹弟兄皆列土", "可憐光彩生門戶"]],
                    [["遂令天下父母心", "不重生男重生女"], ["驪宮高處入青雲", "仙樂風飄處處聞"], ["緩歌慢舞凝絲竹", "盡日君王看不足"], ["漁陽鞞鼓動地來", "驚破霓裳羽衣曲"]],
                    [["九重城闕煙塵生", "千乘萬騎西南行"], ["翠華搖搖行復止", "西出都門百餘里"], ["六軍不發無奈何", "宛轉娥眉馬前死"], ["花鈿委地無人收", "翠翹金雀玉搔頭"]],
                    [["君王掩面救不得", "迴看血淚相和流"], ["黃埃散漫風蕭索", "雲棧縈紆登劍閣"], ["峨嵋山下少人行", "旌旗無光日色薄"], ["蜀江水碧蜀山青", "聖主朝朝暮暮情"]],
                    [["行宮見月傷心色", "夜雨聞鈴腸斷聲"], ["天旋日轉迴龍馭", "到此躊躇不能去"], ["馬嵬坡下泥土中", "不見玉顔空死處"], ["君臣相顧盡霑衣", "東望都門信馬歸"]],
                    [["歸來池苑皆依舊", "太液芙蓉未央柳"], ["芙蓉如面柳如眉", "對此如何不淚垂"], ["春風桃李花開夜", "秋雨梧桐葉落時"], ["西宮南苑多秋草", "宮葉滿階紅不掃"]],
                    [["梨園弟子白髮新", "椒房阿監青娥老"], ["夕殿螢飛思悄然", "孤燈挑盡未成眠"], ["遲遲鐘鼓初長夜", "耿耿星河欲曙天"], ["鴛鴦瓦冷霜華重", "翡翠衾寒誰與共"]],
                    [["悠悠生死別經年", "魂魄不曾來入夢"], ["臨邛道士鴻都客", "能以精誠致魂魄"], ["為感君王輾轉思", "遂教方士殷勤覓"], ["排空馭氣奔如電", "昇天入地求之遍"]],
                    [["上窮碧落下黃泉", "兩處茫茫皆不見"], ["忽聞海上有仙山", "山在虛無縹緲間"], ["樓閣玲瓏五雲起", "其中綽約多仙子"], ["中有一人字太真", "雪膚花貌參差是"]],
                    [["金闕西廂叩玉扃", "轉教小玉報雙成"], ["聞道漢家天子使", "九華帳裏夢魂驚"], ["攬衣推枕起徘徊", "珠箔銀屏邐迤開"], ["雲鬢半偏新睡覺", "花冠不整下堂來"]],
                    [["風吹仙袂飄颻舉", "猶似霓裳羽衣舞"], ["玉容寂寞淚闌干", "梨花一枝春帶雨"], ["含情凝睇謝君王", "一別音容兩渺茫"], ["昭陽殿裏恩愛絶", "蓬萊宮中日月長"]],
                    [["迴頭下望人寰處", "不見長安見塵霧"], ["唯將舊物表深情", "鈿合金釵寄將去"], ["釵留一股合一扇", "釵擘黃金合分鈿"], ["但令心似金鈿堅", "天上人間會相見"]],
                    [["臨別殷勤重寄詞", "詞中有誓兩心知"], ["七月七日長生殿", "夜半無人私語時"], ["在天願作比翼鳥", "在地願為連理枝"], ["天長地久有時盡", "此恨緜緜無絶期"]]
                ]
            },
            pipa: {
                title: "琵琶行",
                author: "白居易",
                background: "./img/PGE_ppx.jpg",
                pages: [
                    [["潯陽江頭夜送客", "楓葉荻花秋瑟瑟"], ["主人下馬客在船", "舉酒欲飲無管弦"], ["醉不成歡慘將別", "別時茫茫江浸月"], ["忽聞水上琵琶聲", "主人忘歸客不發"]],
                    [["尋聲暗問彈者誰", "琵琶聲停欲語遲"], ["移船相近邀相見", "添酒回燈重開宴"], ["千呼萬喚始出來", "猶抱琵琶半遮面"], ["轉軸撥弦三兩聲", "未成曲調先有情"]],
                    [["絃絃掩抑聲聲思", "似訴平生不得意"], ["低眉信手續續彈", "說盡心中無限事"], ["輕攏慢撚抹復挑", "初為霓裳後綠腰"], ["大絃嘈嘈如急雨", "小絃切切如私語"]],
                    [["嘈嘈切切錯雜彈", "大珠小珠落玉盤"], ["間關鶯語花底滑", "幽咽泉流冰下難"], ["冰泉冷澀絃凝絕", "凝絕不通聲暫歇"], ["別有幽愁暗恨生", "此時無聲勝有聲"]],
                    [["銀瓶乍破水漿迸", "鐵騎突出刀槍鳴"], ["曲終收撥當心畫", "四絃一聲如裂帛"], ["東舟西舫悄無言", "唯見江心秋月白"], ["沉吟放撥插絃中", "整頓衣裳起斂容"]],
                    [["自言本是京城女", "家在蝦蟇陵下住"], ["十三學得琵琶成", "名屬教坊第一部"], ["曲罷曾教善才伏", "妝成每被秋娘妬"], ["五陵年少爭纏頭", "一曲紅綃不知數"]],
                    [["鈿頭雲篦擊節碎", "血色羅裙翻酒汙"], ["今年歡笑復明年", "秋月春風等閑度"], ["弟走從軍阿姨死", "暮去朝來顏色故"], ["門前冷落鞍馬稀", "老大嫁作商人婦"]],
                    [["商人重利輕別離", "前月浮梁買茶去"], ["去來江口守空船", "遶船月明江水寒"], ["夜深忽夢少年事", "夢啼妝淚紅闌干"], ["我聞琵琶已歎息", "又聞此語重唧唧"]],
                    [["同是天涯淪落人", "相逢何必曾相識"], ["我從去年辭帝京", "謫居臥病潯陽城"], ["潯陽小處無音樂", "終歲不聞絲竹聲"], ["住近湓江地低濕", "黃蘆苦竹繞宅生"]],
                    [["其間旦暮聞何物", "杜鵑啼哭猿哀鳴"], ["春江花朝秋月夜", "往往取酒還獨傾"], ["豈無山歌與村笛", "歐啞嘲哳難為聽"], ["今夜聞君琵琶語", "如聽仙樂耳暫明"]],
                    [["莫辭更坐彈一曲", "為君飜作琵琶行"], ["感我此言良久立", "卻坐促絃絃轉急"], ["淒淒不似向前聲", "滿座重聞皆掩泣"], ["就中泣下誰最多", "江州司馬青衫濕"]]
                ]
            }
        };

        const demoConfig = {
            handwritingFile: "handwriting.txt",
            musicFile: "background.mp3",
            studentListFile: "students.json"
        };

        // students.json 格式：
        // [
        //   { "name": "王小明", "font": "wangxiaoming.ttf" },
        //   { "name": "陳小華", "font": "chenxiaohua.ttf" }
        // ]
        let studentList = [];

        let currentPoem = "changhenge",
            currentPage = 0,
            handwritingText = "",
            fontLoaded = false,
            audio = null,
            currentLiveDisplayName = "",
            currentFontName = "DemoStudentFont";
            
        const $ = id => document.getElementById(id);
        const normalize = s => (s || "").replace(/\s+/g, "");

        async function loadStudentList() {
            const select = $("studentSelect");

            try {
                const response = await fetch(demoConfig.studentListFile, { cache: "no-store" });
                if (!response.ok) throw new Error("Student list fetch failed");

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("students.json 必須是陣列");
                }

                studentList = data.filter(student =>
                    student &&
                    typeof student.name === "string" &&
                    typeof student.font === "string" &&
                    student.name.trim() &&
                    student.font.trim()
                );

                select.innerHTML = "";

                if (studentList.length === 0) {
                    select.innerHTML = '<option value="">沒有可展示的學生</option>';
                    $("fileStatus").textContent = "students.json 沒有有效的學生資料";
                    return;
                }

                studentList.forEach((student, index) => {
                    const option = document.createElement("option");
                    option.value = String(index);
                    option.textContent = `${student.name} ｜ ${student.font}`;
                    select.appendChild(option);
                });

                select.selectedIndex = 0;
                await applySelectedStudent(0);
            } catch (error) {
                studentList = [];
                select.innerHTML = '<option value="">無法讀取 students.json</option>';
                $("fileStatus").textContent = "找不到或無法讀取 students.json";
                console.error(error);
            }
        }

        async function applySelectedStudent(index) {
            const student = studentList[index];
            if (!student) return;

            currentLiveDisplayName = student.name;
            $("liveDisplayInput").value = student.name;
            $("liveDisplayName").textContent = student.name;

            try {
                const response = await fetch(student.font, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`字體檔案不存在：${student.font}`);
                }

                const buffer = await response.arrayBuffer();
                currentFontName = "DemoStudentFont_" + index + "_" + Date.now();

                const face = new FontFace(currentFontName, buffer);
                await face.load();
                document.fonts.add(face);

                fontLoaded = true;
                $("fontFileName").textContent = student.font;
                $("fileStatus").textContent =
                    `${student.name} ｜ 展示字體 ✓ ${student.font}`;
                render();
            } catch (error) {
                fontLoaded = false;
                $("fontFileName").textContent = student.font;
                $("fileStatus").textContent =
                    `${student.name} ｜ 展示字體載入失敗`;
                console.error(error);
                render();
            }
        }

        async function loadHandwritingAndMusic() {
            const status = [];
            try {
                const r = await fetch(demoConfig.handwritingFile, { cache: "no-store" });
                if (!r.ok) throw new Error("Fetch failed");
                handwritingText = normalize(await r.text());
                status.push(`TXT ✓（${[...handwritingText].length} 字）`);
            } catch (error) {
                handwritingText = "";
                status.push("handwriting.txt 未找到");
            }
            
            audio = new Audio(demoConfig.musicFile);
            audio.loop = true;
            audio.volume = .3;
            status.push("MP3 已設定");
            
            $("fileStatus").textContent = status.join(" ｜ ");
            render();
        }

        async function loadSelectedStudentFont(file) {
            if (!file) {
                $("fileStatus").textContent = "請選擇展示字體檔";
                return;
            }
            try {
                const buffer = await file.arrayBuffer();
                currentFontName = "ManualDemoStudentFont_" + Date.now();
                const face = new FontFace(currentFontName, buffer);
                await face.load();
                document.fonts.add(face);
                fontLoaded = true;
                $("fontFileName").textContent = file.name;
                $("fileStatus").textContent = `${currentLiveDisplayName || "目前學生"} ｜ 字體 ✓ ${file.name}`;
                render();
            } catch (e) {
                fontLoaded = false;
                $("fontFileName").textContent = "字體載入失敗";
                $("fileStatus").textContent = "無法載入展示字體，請確認檔案格式";
            }
        }

        function classify(text) {
            const out = [];
            for (const c of [...normalize(text)]) {
                if (handwritingText.includes(c)) {
                    out.push("hand");
                } else {
                    out.push("machine");
                }
            }
            return out;
        }

        function segmented(text) {
            const t = normalize(text), c = classify(t);
            return [...t].map((x, i) => `<span class="${c[i]}">${x}</span>`).join("");
        }

        function render() {
            const poem = poems[currentPoem];
            $("poemTitle").textContent = poem.title;

            // 依目前詩詞切換古詩背景圖片
            document.querySelector(".book").style.setProperty(
                "--poem-bg",
                `url("${poem.background}")`
            );
            $("poemAuthor").textContent = poem.author;
            $("pageTotal").textContent = `共 ${poem.pages.length} 頁`;
            $("pageNumber").textContent = `${currentPage + 1} / ${poem.pages.length}`;
            $("prevBtn").disabled = currentPage === 0;
            $("nextBtn").disabled = currentPage === poem.pages.length - 1;
            
            const page = $("page");
            page.innerHTML = "";
            
            for (const [a, b] of poem.pages[currentPage]) {
                const d = document.createElement("div");
                d.className = "line";
                d.innerHTML = segmented(a) + " " + segmented(b);
                page.appendChild(d);
            }
            
            const demoFont = fontLoaded
                ? `"${currentFontName}", serif`
                : '"STKaiti", "KaiTi", "DFKai-SB", serif';

            page.style.fontFamily = demoFont;
            $("liveDisplayName").style.fontFamily = demoFont;
        }

        // 即時展示：輸入文字時同步更新展示姓名
        $("liveDisplayInput").addEventListener("input", e => {
            $("liveDisplayName").textContent =
                e.target.value.trim() || "即時展示";
        });

        $("studentSelect").addEventListener("change", async e => {
            const index = Number(e.target.value);
            if (!Number.isNaN(index)) {
                await applySelectedStudent(index);
            }
        });
        
        $("fontFileInput").addEventListener("change", e => loadSelectedStudentFont(e.target.files[0]));

        // 新增：監聽拉桿事件，即時改變 CSS 變數中的縮放倍率
        $("fontSizeSlider").addEventListener("input", e => {
            document.documentElement.style.setProperty('--font-scale', e.target.value);
        });

        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                currentPoem = t.dataset.poem;
                currentPage = 0;
                render();
            }
        });

        $("prevBtn").onclick = () => {
            if (currentPage > 0) {
                currentPage--;
                render();
            }
        };

        $("nextBtn").onclick = () => {
            if (currentPage < poems[currentPoem].pages.length - 1) {
                currentPage++;
                render();
            }
        };

        $("paperBtn").onclick = () => {
            document.body.classList.remove("bg-night");
            $("paperBtn").classList.add("active");
            $("nightBtn").classList.remove("active");
        };

        $("nightBtn").onclick = () => {
            document.body.classList.add("bg-night");
            $("nightBtn").classList.add("active");
            $("paperBtn").classList.remove("active");
        };

        $("musicBtn").onclick = async () => {
            if (!audio) {
                $("fileStatus").textContent = "找不到 background.mp3";
                return;
            }
            if (audio.paused) {
                try {
                    await audio.play();
                    $("musicBtn").textContent = "♫ 關閉音樂";
                } catch {
                    $("fileStatus").textContent = "MP3 無法播放，請確認檔案位於專案資料夾";
                }
            } else {
                audio.pause();
                $("musicBtn").textContent = "♫ 播放音樂";
            }
        };

        loadStudentList();
        loadHandwritingAndMusic();
    </script>
</body>
</html>
